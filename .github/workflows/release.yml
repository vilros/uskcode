name: Validate and publish Vilros Menu Boards
on:
  workflow_dispatch:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q .
      - run: bash -n install.sh setup.sh upgrade.sh run.sh
      - run: python build_release.py ../vilros-menu-boards.zip
      - name: Publish tested installation ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='vilros-menu-v1.0.0'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace it."
            exit 1
          fi
          sha256sum ../vilros-menu-boards.zip > ../vilros-menu-boards.zip.sha256
          gh release create "$tag" ../vilros-menu-boards.zip ../vilros-menu-boards.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'Vilros Menu Boards 1.0.0 (Max’s Menu RC3)' \
            --prerelease --notes-file RELEASE_NOTES_VILROS.md
